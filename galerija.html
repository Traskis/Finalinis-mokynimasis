<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerija</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pajurio takai</h1>
        
        <input type="checkbox" id="mygtukas">
        <label class="burgeris" for="mygtukas">
            <span></span>
            <span></span>
            <span></span>
        </label>


        <nav>
            <a href="index.html">Pagrindinis</a>
            <a href="galerija.html" aria-current="page">Galerija</a>
            <a href="marsrutai.html">Marsrutai</a>
            <a href="gamta.html" >Gamta</a>
        </nav>
    </header>

    <div class="puslapio-isdestymas">

        <main>
            <section>
                <h1>Galerija</h1>
                <p>Nuotraukos iš Lietuvos pajūrio vietovių.</p>
            </section>

            <fieldset class="field-setas">
                <legend>Pasirink sunkuma</legend>
                <input type="radio" name="sudetingumas" value="visi" checked>
                <label>visi</label>
                <input type="radio" name="sudetingumas" value="lengvi">
                <label>lengvi</label>
                <input type="radio" name="sudetingumas" value="vidutinis">
                <label>vidutinis</label>
                <input type="radio" name="sudetingumas" value="sunkus">
                <label>sunkus</label>
                
            </fieldset>

            <section class="galerijos-tinklelis">
                <figure class="galerijos-nuotrauka sunkus">
                    <img src="klaipedos-molas.jpg">
                    <figcaption>Klaipėdos molas – Melnragės paplūdimys sunkus</figcaption>
                </figure>

                <figure class="galerijos-nuotrauka vidutinis">
                    <img src="Olando-kepure.jpg">
                    <figcaption>Olando kepurė – Girulių paplūdimys vidutinis</figcaption>
                </figure>

                <figure class="galerijos-nuotrauka sunkus">
                    <img src="smiltyne.jpg">
                    <figcaption>Smiltynė – Juodkrantė sunkus</figcaption>
                </figure>

                <figure class="galerijos-nuotrauka lengvas">
                    <img src="Juodkrantes-prieplauka.jpg">
                    <figcaption>Juodkrantės prieplauka – Raganų kalnas lengvas</figcaption>
                </figure>

                <figure class="galerijos-nuotrauka vidutinis">
                    <img src="Tomo-mano.jpg">
                    <figcaption>Tomo Mano kultūros centras – Parnidžio kopa</figcaption>
                </figure>

                <figure class="galerijos-nuotrauka lengvas">
                    <img src="Nidos-centras.jpg">
                    <figcaption>Nidos centras – Parnidžio pažintinis takas</figcaption>
                </figure>

            </section>

        </main>
    
    
        <aside>
    
        </aside>
    </div>

    
    <footer>
        <p>© 2026 Pajūrio takai</p>
    </footer>
</body>
</html>
